name: Guardian Stop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "guardianstop/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-engine.txt
      # Match Render's dependency resolution; this repository currently does not
      # have a stable npm lockfile suitable for npm ci.
      - name: Install Node dependencies
        run: npm install --legacy-peer-deps
      - name: Install Python dependencies
        run: python -m pip install -r requirements-engine.txt
      - name: TypeScript validation
        run: npm run check
      - name: Frontend and backend build
        run: npm run build
      - name: Node tests
        run: npm test
      - name: Python risk tests
        run: python -m unittest discover -s engine/tests -v
